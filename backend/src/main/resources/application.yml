server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: momento-studio-api
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 5s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:momento_studio}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    result-dir: ${APP_RESULT_DIR:./data/results}
  simulation:
    asset-check-delay-ms: ${SIM_ASSET_CHECK_DELAY_MS:1800}
    generate-delay-ms: ${SIM_GENERATE_DELAY_MS:4200}
    finalize-delay-ms: ${SIM_FINALIZE_DELAY_MS:1500}
    failure-stage: ${SIM_FAILURE_STAGE:}
    failure-message: ${SIM_FAILURE_MESSAGE:}
  queue:
    stream-key: ${TASK_STREAM_KEY:momento:tasks}
    consumer-group: ${TASK_CONSUMER_GROUP:momento-workers}
    consumer-prefix: ${TASK_CONSUMER_PREFIX:momento-worker}
    consumers: ${TASK_CONSUMER_COUNT:2}
    max-retries: ${TASK_MAX_RETRIES:3}
    dispatch-interval-ms: ${TASK_DISPATCH_INTERVAL_MS:10000}
    dispatch-initial-delay-ms: ${TASK_DISPATCH_INITIAL_DELAY_MS:30000}
    poll-block-ms: ${TASK_POLL_BLOCK_MS:2000}
  rate-limit:
    tasks-per-minute: ${TASK_RATE_LIMIT_PER_MINUTE:12}
  dev-api:
    enabled: ${APP_DEV_API_ENABLED:true}
  auth:
    cookie-name: ${APP_AUTH_COOKIE_NAME:momento_session}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    session-days: ${APP_SESSION_DAYS:30}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    com.momento.studio: INFO
